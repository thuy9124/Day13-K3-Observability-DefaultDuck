alerts:
  - name: HighLatencyP95
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: AI Platform On-call
    runbook: docs/alerts.md#highlatencyp95
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: AI Platform On-call
    runbook: docs/alerts.md#higherrorrate
  - name: LowQualityScore
    severity: warning
    condition: quality_score_avg < 0.75 for 15m
    type: symptom-based
    owner: AI Quality Owner
    runbook: docs/alerts.md#lowqualityscore